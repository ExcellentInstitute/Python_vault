Title: 1. Check Whether a Number is Prime
Category: Python Core
Code:
# Program 1: Find whether a number is a prime number
print("=== Prime Number Checker ===")
num = int(input("Enter an integer: "))

if num <= 1:
    print(f"{num} is NOT a prime number.")
else:
    is_prime = True
    for i in range(2, int(num ** 0.5) + 1):
        if num % i == 0:
            is_prime = False
            break

    if is_prime:
        print(f"{num} is a PRIME number.")
    else:
        print(f"{num} is NOT a prime number.")

# Program 4: Summation of series 1 - 2 + 3 - 4 + 5 - 6 + ... up to n terms
print("=== Alternating Series Summation ===")
n = int(input("Enter number of terms (n): "))

total_sum = 0
series_terms = []

for i in range(1, n + 1):
    if i % 2 != 0:
        total_sum += i
        series_terms.append(f"+{i}" if i > 1 else f"{i}")

Title: 6. Find All Occurrence Indices of Substring in String
Category: Python Core
Code:
# Program 6: Return indices of all occurrences of second string in first string or -1
def find_all_occurrences(main_str, sub_str):
    indices = []
    start = 0
    while True:
        pos = main_str.find(sub_str, start)
        if pos == -1:
            break
        indices.append(pos)
        start = pos + 1

    return indices if len(indices) > 0 else -1

print("=== Substring Occurrence Indices Finder ===")
first_string = input("Enter the first (main) string: ")
second_string = input("Enter the second (search) string: ")

result = find_all_occurrences(first_string, second_string)
print("\nOutput:", result)

# Program 8: Calculate frequency of each letter in a sentence using a dictionary
def count_letter_frequency(sentence):
    freq_dict = {}
    for ch in sentence:
        if ch.isalpha():
            letter = ch.lower()
            freq_dict[letter] = freq_dict.get(letter, 0) + 1
    return freq_dict

print("=== Letter Frequency Counter (Dictionary) ===")
user_sentence = input("Enter a sentence: ")

letter_counts = count_letter_frequency(user_sentence)

print("\nDictionary of Letter Frequencies:")
print(letter_counts)

print("\nFormatted Breakdown:")
for letter, count in sorted(letter_counts.items()):
    print(f"'{letter}' : {count}")

def copy_odd_lines(file1_name, file2_name):
    with open(file1_name, "r") as f1, open(file2_name, "w") as f2:

# Program 12: Read a list of integers from user and throw an exception on duplicates
class DuplicateNumberError(Exception):
    """Custom exception raised when duplicate integers are found."""
    pass

print("=== Duplicate Integer Exception Checker ===")
raw_input_str = input("Enter integers separated by spaces (e.g., 10 20 30 20): ")

try:
    numbers = [int(x) for x in raw_input_str.split()]
    seen = set()

    for num in numbers:
        if num in seen:
            raise DuplicateNumberError(f"Duplicate integer detected: {num}")
        seen.add(num)

    print("\nSuccess! All entered integers are unique:", numbers)

except DuplicateNumberError as err:
    print(f"\n[Exception Thrown] {err}")
except ValueError:
    print("\n[Error] Please enter valid integers separated by spaces.")

# Program 13: Display Sine, Cosine, Polynomial, and Exponential curves using a function
import numpy as np
import matplotlib.pyplot as plt

def display_mathematical_curves():
    x = np.linspace(-2 * np.pi, 2 * np.pi, 200)
    x_small = np.linspace(-3, 3, 200)

    fig, axes = plt.subplots(2, 2, figsize=(10, 8))
    fig.suptitle("Sine, Cosine, Polynomial & Exponential Curves", fontsize=14, fontweight="bold")

    # 1. Sine Curve
    axes[0, 0].plot(x, np.sin(x), color="royalblue", linewidth=2)
    axes[0, 0].set_title("Sine Curve: y = sin(x)")
    axes[0, 0].set_xlabel("x (radians)")
    axes[0, 0].set_ylabel("sin(x)")
    axes[0, 0].grid(True, linestyle="--", alpha=0.6)

    # 2. Cosine Curve
    axes[0, 1].plot(x, np.cos(x), color="crimson", linewidth=2)
    axes[0, 1].set_title("Cosine Curve: y = cos(x)")
    axes[0, 1].set_xlabel("x (radians)")
    axes[0, 1].set_ylabel("cos(x)")
    axes[0, 1].grid(True, linestyle="--", alpha=0.6)

    # 3. Polynomial Curve (y = x^3 - 3x)
    axes[1, 0].plot(x_small, x_small**3 - 3 * x_small, color="forestgreen", linewidth=2)
    axes[1, 0].set_title("Polynomial Curve: y = x³ - 3x")
    axes[1, 0].set_xlabel("x")
    axes[1, 0].set_ylabel("y")
    axes[1, 0].grid(True, linestyle="--", alpha=0.6)

    # 4. Exponential Curve (y = e^x)
    axes[1, 1].plot(x_small, np.exp(x_small), color="darkorange", linewidth=2)
    axes[1, 1].set_title("Exponential Curve: y = eˣ")
    axes[1, 1].set_xlabel("x")
    axes[1, 1].set_ylabel("eˣ")
    axes[1, 1].grid(True, linestyle="--", alpha=0.6)

    plt.tight_layout()
    plt.show()
    print("Curves generated! View the plot in the Visual Graph Viewer.")

display_mathematical_curves()
